<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Der Dümmste Fliegt</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐦</text></svg>">
    <link rel="stylesheet" href="frontend/css/style.css">
</head>
<body>
    <main id="app">
        <section id="connectingScreen">
            <div class="spinner"></div>
            <p>Verbindung zum Server wird hergestellt...</p>
        </section>

        <section id="roomScreen">
            <div id="settingsSection">
                <h2 id="textSettingsHeading">Einstellungen</h2>
                <div id="settingsGrid">
                    <div class="settingItem" id="settingStartingLives">
                        <p class="settingLabel">Start-Herzen</p>
                        <div class="settingStepper">
                            <button type="button" id="buttonStartingLivesDecrease" aria-label="Weniger Start-Herzen" disabled>−</button>
                            <span id="textStartingLivesValue"></span>
                            <button type="button" id="buttonStartingLivesIncrease" aria-label="Mehr Start-Herzen" disabled>+</button>
                        </div>
                    </div>

                    <div class="settingItem" id="settingQuestionsPerPlayerPerRound">
                        <p class="settingLabel">Fragen pro Spieler pro Runde</p>
                        <div class="settingStepper">
                            <button type="button" id="buttonQuestionsPerPlayerPerRoundDecrease" aria-label="Weniger Fragen pro Spieler pro Runde" disabled>−</button>
                            <span id="textQuestionsPerPlayerPerRoundValue"></span>
                            <button type="button" id="buttonQuestionsPerPlayerPerRoundIncrease" aria-label="Mehr Fragen pro Spieler pro Runde" disabled>+</button>
                        </div>
                    </div>
                </div>
            </div>

            <button id="buttonStartGame" hidden>Spiel starten</button>
        </section>

        <section id="gameScreen" hidden>
            <div id="timerBarTrack">
                <div id="timerBarFill"></div>
            </div>

            <div id="questionArea">
                <p id="textQuestion"></p>
                <p id="textVotingHint" hidden>Vote nun die Person die für dich diese Runde am dümmsten war.</p>
                <p id="textTiebreakVotingHint" hidden></p>
                <p id="textFinaleProgress" hidden></p>

                <div id="answerInputRow">
                    <input id="inputAnswer" type="text" placeholder="Antwort eingeben" maxlength="200">
                    <button id="buttonSubmitAnswer">Absenden</button>
                </div>

                <div id="tiebreakAnswerRow" hidden>
                    <div id="tiebreakAnswerLeft" class="finalePlayerAnswer">
                        <p class="finalePlayerName" id="textTiebreakNameLeft"></p>
                        <input id="inputTiebreakAnswerLeft" type="text" placeholder="Antwort eingeben" maxlength="200">
                        <button id="buttonSubmitTiebreakAnswerLeft">Absenden</button>
                    </div>
                    <div id="tiebreakAnswerRight" class="finalePlayerAnswer">
                        <p class="finalePlayerName" id="textTiebreakNameRight"></p>
                        <input id="inputTiebreakAnswerRight" type="text" placeholder="Antwort eingeben" maxlength="200">
                        <button id="buttonSubmitTiebreakAnswerRight">Absenden</button>
                    </div>
                </div>

                <div id="finaleAnswerRow" hidden>
                    <div id="finaleAnswerLeft" class="finalePlayerAnswer">
                        <p class="finalePlayerName" id="textFinaleNameLeft"></p>
                        <input id="inputFinaleAnswerLeft" type="text" placeholder="Antwort eingeben" maxlength="200">
                        <button id="buttonSubmitFinaleAnswerLeft">Absenden</button>
                    </div>
                    <div id="finaleAnswerRight" class="finalePlayerAnswer">
                        <p class="finalePlayerName" id="textFinaleNameRight"></p>
                        <input id="inputFinaleAnswerRight" type="text" placeholder="Antwort eingeben" maxlength="200">
                        <button id="buttonSubmitFinaleAnswerRight">Absenden</button>
                    </div>
                </div>

                <div id="answerReveal" hidden>
                    <p id="textPlayerAnswer"></p>
                    <p id="textCorrectAnswer"></p>
                </div>

                <div id="tiebreakReveal" hidden>
                    <p id="textTiebreakAnswerLeft"></p>
                    <p id="textTiebreakAnswerRight"></p>
                    <p id="textTiebreakCorrectAnswer"></p>
                </div>

                <div id="finaleReveal" hidden>
                    <p id="textFinaleAnswerLeft"></p>
                    <p id="textFinaleAnswerRight"></p>
                    <p id="textFinaleCorrectAnswer"></p>
                </div>

                <div id="votingResult" hidden>
                    <ul id="listVotes"></ul>
                    <p id="textVotingOutcome"></p>
                </div>

                <div id="finaleResult" hidden>
                    <p id="textFinaleWinner"></p>
                    <button id="buttonRestartGame" hidden>Spiel neu starten</button>
                </div>
            </div>

            <ul id="listPlayersInGame"></ul>

            <div id="deadPlayersBox" hidden>
                <p id="textDeadPlayersHeading">Tote Spieler</p>
                <ul id="listDeadPlayers"></ul>
            </div>
        </section>

        <button id="buttonLeaveRoom" class="buttonLeaveRoom">Verlassen</button>
    </main>

    <script src="https://der-dummste-fliegt.onrender.com/socket.io/socket.io.js"></script>
    <script type="module" src="frontend/js/room.js"></script>
</body>
</html>
